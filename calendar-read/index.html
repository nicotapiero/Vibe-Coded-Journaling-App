<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journal Calendar</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 1000px;
        margin: 0 auto;
      }

      h1 {
        margin-bottom: 4px;
      }

      .subnav {
        margin-bottom: 20px;
        color: #555;
      }

      .subnav a {
        color: #555;
      }

      .month-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 16px 0;
      }

      .month-header h2 {
        margin: 0;
        min-width: 220px;
        text-align: center;
      }

      .month-header button {
        padding: 8px 14px;
        font-size: 14px;
        cursor: pointer;
        border: 1px solid #ccc;
        background: #f2f2f2;
        border-radius: 4px;
      }

      .month-header button:hover {
        background: #e6e6e6;
      }

      .month-nav-group {
        display: flex;
        gap: 8px;
      }

      .calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }

      .dow {
        text-align: center;
        font-weight: bold;
        font-size: 13px;
        color: #777;
        padding-bottom: 4px;
      }

      .day {
        border: 1px solid #ccc;
        border-radius: 4px;
        min-height: 110px;
        padding: 6px;
        overflow: hidden;
        cursor: pointer;
        background: #fff;
        display: flex;
        flex-direction: column;
      }

      .day:hover {
        box-shadow: 0 0 0 2px #888 inset;
      }

      .day.empty {
        border: none;
        cursor: default;
      }

      .day.empty:hover {
        box-shadow: none;
      }

      .day.today {
        border-color: #444;
        border-width: 2px;
      }

      .day-num {
        font-size: 12px;
        color: #888;
        margin-bottom: 2px;
      }

      .day-title {
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .day-snippet {
        font-size: 11px;
        color: #444;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        line-height: 1.3;
      }

      .day.unfinished {
        background-color: #f6d7dc;
      }

      .day.finished {
        background-color: #dcebe1;
      }

      .day.no-entry {
        background-color: #fafafa;
      }

      /* Modal */
      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        background: #fff;
        border-radius: 6px;
        padding: 20px 24px;
        max-width: 600px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        position: relative;
      }

      .modal h3 {
        margin-top: 0;
        margin-bottom: 2px;
      }

      .modal .modal-date {
        color: #888;
        font-size: 13px;
        margin-bottom: 14px;
      }

      .modal .modal-close {
        position: absolute;
        top: 12px;
        right: 16px;
        cursor: pointer;
        font-size: 20px;
        color: #888;
        background: none;
        border: none;
      }

      .modal .modal-status {
        display: inline-block;
        margin-top: 14px;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 12px;
      }

      .modal .modal-status.unfinished {
        background-color: #EA526F;
        color: #fff;
      }

      .modal .modal-status.finished {
        background-color: #629677;
        color: #fff;
      }

      .loading {
        color: #888;
        font-style: italic;
      }
    </style>

    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <h1>Journal Calendar</h1>
    <div class="subnav">
      <a href="../read-particular">read particular here</a> &middot;
      <a href="../read-legacy">read legacy here</a>
    </div>

    <div class="month-header">
      <button id="prevBtn">&larr; Prev</button>
      <div class="month-nav-group">
        <h2 id="monthLabel">Loading...</h2>
      </div>
      <button id="nextBtn">Next &rarr;</button>
    </div>
    <div style="text-align:center; margin-bottom: 10px;">
      <button id="todayBtn" style="padding:6px 12px; font-size:13px; cursor:pointer; border:1px solid #ccc; background:#f2f2f2; border-radius:4px;">Today</button>
    </div>

    <div id="status" class="loading">Connecting to Google...</div>
    <div class="calendar" id="calendarGrid"></div>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <button class="modal-close" id="modalClose">&times;</button>
        <h3 id="modalTitle"></h3>
        <div class="modal-date" id="modalDate"></div>
        <div id="modalEntry"></div>
        <div id="modalStatus"></div>
      </div>
    </div>

    <script>
      const SHEET_ID = "1Lu1wccCd8QsLtJP3jsfQXub4tVNXRrnM8lC588SDbTA";
      const CLIENT_ID = "400130720536-l3dqr1rnpo1m1n7r2liaman6lptt7nk8.apps.googleusercontent.com";
      const SCOPES = "https://www.googleapis.com/auth/spreadsheets.readonly";

      let gapiInited = false;
      let tokenClient;

      // current displayed month (1st of month, local time)
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let viewDate = new Date(today.getFullYear(), today.getMonth(), 1);

      // cache of entries per sheet-year: { year: Map(dateStr -> row) }
      const yearCache = {};

      function gapiLoaded() {
        gapi.load("client", initializeGapiClient);
      }

      async function initializeGapiClient() {
        await gapi.client.init({
          discoveryDocs: ["https://sheets.googleapis.com/$discovery/rest?version=v4"],
        });
        gapiInited = true;
        maybeEnableButtons();
      }

      function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: (tokenResponse) => {
            gapi.client.setToken(tokenResponse);
            renderCalendar();
          },
        });
        maybeEnableButtons();
      }

      function maybeEnableButtons() {
        if (gapiInited && tokenClient) {
          tokenClient.requestAccessToken();
        }
      }

      async function fetchYear(year) {
        if (yearCache[year]) return yearCache[year];
        const res = await gapi.client.sheets.spreadsheets.values.get({
          spreadsheetId: SHEET_ID,
          range: `${year}!A:D`,
        });
        const data = res.result.values || [];
        const map = new Map();
        data.forEach(row => {
          if (row[0]) map.set(row[0], row);
        });
        yearCache[year] = map;
        return map;
      }

      function fmtDateStr(d) {
        return d.toISOString().split("T")[0];
      }

      async function renderCalendar() {
        const statusEl = document.getElementById("status");
        const grid = document.getElementById("calendarGrid");
        const monthLabel = document.getElementById("monthLabel");

        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();
        const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        monthLabel.textContent = `${monthNames[month]} ${year}`;

        statusEl.textContent = "Loading entries...";
        statusEl.style.display = "block";
        grid.innerHTML = "";

        let entriesMap;
        try {
          entriesMap = await fetchYear(year);
          statusEl.style.display = "none";
        } catch (err) {
          statusEl.textContent = "Could not load entries for " + year + " (is there a tab named '" + year + "' in the sheet?)";
          entriesMap = new Map();
        }

        const dowLabels = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        dowLabels.forEach(l => {
          const el = document.createElement("div");
          el.className = "dow";
          el.textContent = l;
          grid.appendChild(el);
        });

        const firstOfMonth = new Date(year, month, 1);
        const startWeekday = firstOfMonth.getDay(); // 0 = Sun
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Leading blanks
        for (let i = 0; i < startWeekday; i++) {
          const blank = document.createElement("div");
          blank.className = "day empty";
          grid.appendChild(blank);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(year, month, d);
          const dateStr = fmtDateStr(dateObj);
          const row = entriesMap.get(dateStr);

          const dayEl = document.createElement("div");
          const isUnfinished = row && row[3] && row[3].toUpperCase() === "TRUE";
          const hasEntry = !!row;

          let statusClass = "no-entry";
          if (hasEntry) statusClass = isUnfinished ? "unfinished" : "finished";

          dayEl.className = `day ${statusClass}`;
          if (dateObj.getTime() === today.getTime()) {
            dayEl.classList.add("today");
          }

          const title = row?.[1] || "";
          const entryText = row?.[2] || "";
          const snippet = entryText.length > 0 ? entryText : (title ? "" : "(no entry)");

          dayEl.innerHTML = `
            <div class="day-num">${d}</div>
            ${title ? `<div class="day-title">${escapeHtml(title)}</div>` : ""}
            <div class="day-snippet">${escapeHtml(snippet)}</div>
          `;

          dayEl.addEventListener("click", () => openModal(dateObj, row));
          grid.appendChild(dayEl);
        }
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function openModal(dateObj, row) {
        const backdrop = document.getElementById("modalBackdrop");
        const titleEl = document.getElementById("modalTitle");
        const dateEl = document.getElementById("modalDate");
        const entryEl = document.getElementById("modalEntry");
        const statusEl = document.getElementById("modalStatus");

        const daysOfWeek = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const formatted = `${daysOfWeek[dateObj.getDay()]}, ${fmtDateStr(dateObj)}`;

        titleEl.textContent = row?.[1] || "(No title)";
        dateEl.textContent = formatted;
        const entryText = row?.[2] || "(No entry written)";
        entryEl.innerHTML = escapeHtml(entryText).replace(/\n/g, "<br>");

        const isUnfinished = row && row[3] && row[3].toUpperCase() === "TRUE";
        if (row) {
          statusEl.innerHTML = `<span class="modal-status ${isUnfinished ? "unfinished" : "finished"}">${isUnfinished ? "Unfinished" : "Finished"}</span>`;
        } else {
          statusEl.innerHTML = "";
        }

        backdrop.classList.add("open");
      }

      function closeModal() {
        document.getElementById("modalBackdrop").classList.remove("open");
      }

      document.getElementById("modalClose").addEventListener("click", closeModal);
      document.getElementById("modalBackdrop").addEventListener("click", (e) => {
        if (e.target.id === "modalBackdrop") closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      document.getElementById("prevBtn").addEventListener("click", () => {
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
        renderCalendar();
      });
      document.getElementById("nextBtn").addEventListener("click", () => {
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
        renderCalendar();
      });
      document.getElementById("todayBtn").addEventListener("click", () => {
        viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
        renderCalendar();
      });

      window.onload = () => {
        gapiLoaded();
        gisLoaded();
      };
    </script>
  </body>
</html>
