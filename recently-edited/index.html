<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recently Edited Entries</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f2f2f2;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    .entry {
      white-space: pre-wrap;
    }
  </style>

  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

<h1>Journal Entries Edited Within Last 24 Hours</h1>

<button onclick="loadRecentEntries()">Refresh</button>

<table id="recentTable">
  <thead>
    <tr>
      <th>Date</th>
      <th>Title</th>
      <th>Last Edited</th>
      <th>Entry</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>

const SHEET_ID = "1Lu1wccCd8QsLtJP3jsfQXub4tVNXRrnM8lC588SDbTA";
const RANGE = "2026!A:E";

const CLIENT_ID =
"400130720536-l3dqr1rnpo1m1n7r2liaman6lptt7nk8.apps.googleusercontent.com";

const SCOPES = "https://www.googleapis.com/auth/spreadsheets";

let gapiInited = false;
let tokenClient;

function gapiLoaded() {
  gapi.load("client", initializeGapiClient);
}

async function initializeGapiClient() {
  await gapi.client.init({
    discoveryDocs: [
      "https://sheets.googleapis.com/$discovery/rest?version=v4",
    ],
  });

  gapiInited = true;
  maybeEnableButtons();
}

function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (tokenResponse) => {
      gapi.client.setToken(tokenResponse);
      loadRecentEntries();
    },
  });

  maybeEnableButtons();
}

function maybeEnableButtons() {
  if (gapiInited && tokenClient) {
    tokenClient.requestAccessToken();
  }
}

function formatLocalTimestamp(timestamp) {
  if (!timestamp) return "(Never)";

  return new Date(timestamp).toLocaleString([], {
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
  });
}

async function loadRecentEntries() {

  const res = await gapi.client.sheets.spreadsheets.values.get({
    spreadsheetId: SHEET_ID,
    range: RANGE,
  });

  const rows = res.result.values || [];

  const tbody = document.querySelector("#recentTable tbody");
  tbody.innerHTML = "";

  const cutoff = Date.now() - 24 * 60 * 60 * 1000;

  let count = 0;

  rows.forEach(row => {

    const lastEdited = row[4];

    if (!lastEdited)
      return;

    const editTime = new Date(lastEdited).getTime();

    if (isNaN(editTime))
      return;

    if (editTime >= cutoff) {

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${row[0]}</td>
        <td>${row[1] || "(No title)"}</td>
        <td>${formatLocalTimestamp(lastEdited)}</td>
        <td class="entry">${(row[2] || "(No entry)").replace(/\n/g,"<br>")}</td>
      `;

      tbody.appendChild(tr);
      count++;
    }
  });

  alert(`${count} entries edited within the last 24 hours.`);
}

window.onload = () => {
  gapiLoaded();
  gisLoaded();
};

document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "r") {
    e.preventDefault();
    loadRecentEntries();
  }
});

</script>

</body>
</html>
